name: BleachSMP
version: '0.1.0'
main: dev.bleachsmp.BleachSmpPlugin
description: A BLEACH-inspired Paper SMP plugin.
author: BleachSMP
api-version: '1.21.11'

commands:
  bleach:
    description: View your faction, rank, and awakenings, or release an awakened form.
    usage: /bleach [status|choose|awakenings|release|garganta|boss]
    aliases: [bleachsmp]

permissions:
  bleachsmp.admin:
    description: Manage custom bosses and test Bankai awakening stages.
    default: op
