name: Hueco Mundo screenshot
on: workflow_dispatch

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libgl1-mesa-dri libopenal1
      - run: xvfb-run -a -s '-screen 0 1280x800x24' python3 .github/scripts/hueco-screenshot.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: hueco-mundo-in-game
          path: target/hueco-capture/hueco-mundo.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capture-logs
          path: |
            target/hueco-capture/*.log
            target/hueco-capture/client/crash-reports/
